# Steam's container (pressure-vessel) hides host OpenXR runtimes unless asked,
# and the host's /usr -- where Monado lives -- appears only at /run/host/usr.
# This makes it remap the active runtime into every game, so no per-game launch
# option is needed. Harmless while SteamVR is active: its manifest is in $HOME.
PRESSURE_VESSEL_IMPORT_OPENXR_1_RUNTIMES=1

# Track the Index through SteamVR's own lighthouse driver (steamvr_lh), the
# better-tracked one. Session-wide rather than in monado.service so that
# running monado-service by hand behaves the same.
STEAMVR_LH_ENABLE=true

# If Monado ever falls back to its own lighthouse driver, that driver turns on
# camera hand tracking, whose ONNX models Fedora does not ship, and aborts.
LH_HANDTRACKING=false
