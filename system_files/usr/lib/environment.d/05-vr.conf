# Named to sort before home-manager's 10-home-manager.conf: environment.d
# merges files from all directories by name and the last assignment wins, so
# a user's own settings override these defaults.

# Steam's container (pressure-vessel) hides host OpenXR runtimes unless asked,
# and the host's /usr -- where Monado lives -- appears only at /run/host/usr.
# This makes it remap the active runtime into every game, so no per-game launch
# option is needed. Harmless while SteamVR is active: its manifest is in $HOME.
PRESSURE_VESSEL_IMPORT_OPENXR_1_RUNTIMES=1

# Track the Index through SteamVR's own lighthouse driver (steamvr_lh), the
# better-tracked one. Session-wide rather than in monado.service so that
# running monado-service by hand behaves the same.
STEAMVR_LH_ENABLE=true

# If Monado ever falls back to its own lighthouse driver, that driver turns on
# camera hand tracking, whose ONNX models Fedora does not ship, and aborts.
LH_HANDTRACKING=false

# Monado defaults to the Index's fastest mode, 144 Hz (officially
# experimental), where creating the direct-mode swapchain fails with
# VK_ERROR_INITIALIZATION_FAILED and Monado segfaults. Mode 0 is the EDID's
# preferred timing, 90 Hz. Verify with the pacer's estimated_frame_period
# (11.11ms) after changing this.
XRT_COMPOSITOR_DESIRED_MODE=0

# Controllers and base stations often report after the default 3 s discovery
# window, and Monado cannot add devices once setup is done.
LH_DISCOVER_WAIT_MS=8000

# Exit once no client has been connected for 5 minutes; the socket restarts it
# on the next connection. Exiting on every disconnect instead would kill it
# between Proton's OpenXR probe and the game's own connection.
IPC_EXIT_WHEN_IDLE=true
IPC_EXIT_WHEN_IDLE_DELAY_MS=300000

# Put the base stations into standby when Monado exits, as SteamVR does.
LH_STANDBY_ON_EXIT=true
